<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<label for="name">Full Name:</label>
    <input id="name" type="text">
    <br>
    <label for="email">Email:</label>
    <input id="email" type="email">
    <br>
	<p>Gender:</p>
    
    <input id="online" type="radio" value="online" name="learning">
    <label for="online">Male</label>
    <input type="radio" value="offline" id="offline" name="learning">
    <label for="offline">Female</label>
	<br>
    <label for="cars">Car Brands:</label>
    <select name="" id="cars">
        <option value="pune">BMW</option>
        <option value="mumbai">Audi</option>
        <option value="delhi">Mercedez</option>
    </select>
    <br>
    <label for="carage">Car Age:</label>
    <input id="carage" type="number">
    <br>
    <label for="dob">Date of Purchase (dop):</label>
    <input id="dob" type="date">
    <br>
    <label for="password">Password:</label>
    <input id="password" type="password">
    <br>
    
    <button>Register</button>
    <script type="text/javascript" src="./script.js">

</body>

</html>
